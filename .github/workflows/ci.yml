name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pillow numpy imageio-ffmpeg

      - name: Ruff (lint)
        run: ruff check scripts/ tests/

      - name: Pytest
        run: pytest tests/ -v

      - name: Schema apply check
        run: |
          python -c "import sqlite3; conn=sqlite3.connect(':memory:'); conn.executescript(open('scripts/schema.sql').read()); print('OK schema applies cleanly')"

  leak-scan:
    name: Credential leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for obvious credentials
        run: |
          set +e
          # tracked files only (.gitignore'd files don't matter here)
          PATTERN='gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|pat_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          HITS=$(git grep -E "$PATTERN" 2>/dev/null)
          if [ -n "$HITS" ]; then
            echo "::error::Possible credential leak in tracked files:"
            echo "$HITS"
            exit 1
          fi
          echo "OK no credential signatures found in tracked content"
